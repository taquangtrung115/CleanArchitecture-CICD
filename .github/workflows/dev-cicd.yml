name: DEV Environment CI/CD

# Trigger workflow on push or pull request to DEV branch
on:
  push:
    branches:
      - DEV
  pull_request:
    branches:
      - DEV

env:
  DOTNET_VERSION: '7.0.x'
  NODE_VERSION: '22'
  BUILD_CONFIGURATION: Release
  
jobs:
  # Backend Build, Test, and Publish
  backend:
    name: 🔨 Backend Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: 📦 Restore dependencies
        run: dotnet restore DemoCICD.sln
        
      - name: 🧹 Clean solution
        run: dotnet clean DemoCICD.sln --configuration ${{ env.BUILD_CONFIGURATION }}
        
      - name: 🔨 Build solution
        run: dotnet build DemoCICD.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
        
      - name: 🧪 Run Unit Tests
        run: dotnet test DemoCICD.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
        
      - name: 📊 Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Tests
          path: '**/test-results.trx'
          reporter: dotnet-trx
          fail-on-error: true
          
      - name: 📦 Publish Backend
        run: dotnet publish src/DemoCICD.API/DemoCICD.API.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ./publish/backend
        
      - name: 📤 Upload Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts
          path: ./publish/backend
          retention-days: 7

  # Frontend Build and Publish
  frontend:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: './frontend/yarn.lock'
          
      - name: 📦 Install dependencies
        run: |
          corepack enable
          yarn set version 4.9.1
          yarn install --immutable
          
      - name: 🔍 Lint code
        run: yarn lint
        continue-on-error: true
        
      - name: 🔨 Build frontend
        run: yarn build
        env:
          NODE_ENV: production
          
      - name: 📤 Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifacts
          path: ./frontend/dist
          retention-days: 7

  # Database Migration Check
  database:
    name: 🗄️ Database Migration Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: 📦 Install EF Core Tools
        run: dotnet tool install --global dotnet-ef
        
      - name: 🔍 Check Migrations
        run: |
          dotnet restore src/DemoCICD.Persistence/DemoCICD.Persistence.csproj
          dotnet ef migrations list --project src/DemoCICD.Persistence/DemoCICD.Persistence.csproj --startup-project src/DemoCICD.API/DemoCICD.API.csproj || echo "Migration check completed"
        
      - name: 📝 Generate Migration Script
        run: |
          dotnet ef migrations script --project src/DemoCICD.Persistence/DemoCICD.Persistence.csproj --startup-project src/DemoCICD.API/DemoCICD.API.csproj --idempotent --output ./migration-script.sql || echo "No migrations to script"
        continue-on-error: true
        
      - name: 📤 Upload Migration Script
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-script
          path: ./migration-script.sql
          retention-days: 30
          if-no-files-found: ignore

  # Deployment Summary
  deployment-summary:
    name: 📋 Deployment Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, database]
    if: always()
    
    steps:
      - name: 📊 Deployment Status
        run: |
          echo "==================================="
          echo "DEV Environment CI/CD Summary"
          echo "==================================="
          echo "Backend Build: ${{ needs.backend.result }}"
          echo "Frontend Build: ${{ needs.frontend.result }}"
          echo "Database Check: ${{ needs.database.result }}"
          echo "==================================="
          echo ""
          echo "✅ Artifacts are ready for deployment!"
          echo ""
          echo "📦 Backend artifacts: Available in 'backend-artifacts'"
          echo "📦 Frontend artifacts: Available in 'frontend-artifacts'"
          echo "📦 Migration script: Available in 'migration-script'"
          echo ""
          echo "🚀 To deploy to your server:"
          echo "   1. Download the artifacts from this workflow run"
          echo "   2. Apply database migrations using the migration script"
          echo "   3. Deploy backend to your IIS/hosting server"
          echo "   4. Deploy frontend to your web server"
